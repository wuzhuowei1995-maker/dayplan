<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f5f5f2"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="DayPlan">
<title>DayPlan</title><link rel="manifest" href="./manifest.json">
<style>
:root{color-scheme:light;--bg:#f5f5f2;--text:#111;--muted:#666}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--text);
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif}
body{min-height:100dvh;touch-action:none;user-select:none;-webkit-user-select:none}
#app{position:fixed;inset:0;overflow:hidden;background:var(--bg)}
.card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
padding:max(34px,env(safe-area-inset-top)) 28px max(38px,env(safe-area-inset-bottom));text-align:center;background:var(--bg);
will-change:transform,opacity}
.meta{max-width:94%;margin-bottom:25px;font-size:clamp(15px,4.2vw,19px);line-height:1.35;color:var(--muted);font-weight:500}
.title{max-width:94%;font-size:clamp(38px,10.5vw,62px);line-height:1.08;font-weight:720;letter-spacing:-.035em;overflow-wrap:anywhere}
.note{max-width:90%;margin-top:24px;font-size:clamp(18px,4.8vw,23px);line-height:1.45;color:var(--muted)}
.exit-up{transform:translateY(-18%);opacity:0;transition:.15s}.exit-down{transform:translateY(18%);opacity:0;transition:.15s}
.enter-up{transform:translateY(15%);opacity:0}.enter-down{transform:translateY(-15%);opacity:0}
.enter-active{transform:translateY(0);opacity:1;transition:.17s}
</style></head><body><main id="app"></main><script src="./schedule.js"></script><script src="./app.js"></script></body></html>
